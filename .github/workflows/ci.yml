name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the "extension" descriptor needs jpm 0.12.0 (until then: JPM_VERSION=canary)
      - name: Install jpm
        run: |
          curl -fsSL https://github.com/java-package-manager/jpm/releases/latest/download/install.sh | JPM_VERSION=canary sh
          echo "$HOME/.jpm/bin" >> "$GITHUB_PATH"
      - run: jpm test --frozen
      - run: jpm build
