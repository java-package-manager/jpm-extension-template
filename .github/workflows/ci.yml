name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the "extension" descriptor needs jpm 0.12.0 (until then: the canary)
      - uses: java-package-manager/setup-jpm@1
        with:
          version: canary
      - run: jpm test --frozen
      - run: jpm build
